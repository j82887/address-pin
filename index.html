<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="貼上地址，查詢與複製經緯度，並在 Google Maps 核對。"><title>地址轉經緯度</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/png" sizes="48x48" href="./pin-blue-48.png"><link rel="apple-touch-icon" href="./pin-blue-180.png"><link rel="manifest" href="./site.webmanifest"><meta name="theme-color" content="#193c70"></head><body><main><header><h1 class="brand"><span aria-hidden="true">⌖</span> 地址轉經緯度</h1></header><nav aria-label="查詢方式"><a href="./" aria-current="page">地址查詢</a><a href="coordinates.html">經緯度反查</a></nav><section class="card"><form id="form"><div class="input-wrap"><textarea aria-label="輸入地址" id="address" placeholder="貼上完整地址或地標名稱" maxlength="240" rows="2" required></textarea><button type="button" id="clear" aria-label="清空地址">×</button></div><button id="search" class="primary" type="submit"><span>查詢經緯度</span><span>↗</span></button></form><a id="address-map" class="address-map" target="_blank" rel="noopener noreferrer" hidden>用 Google Maps 搜尋地址 ↗</a><div id="normalized" hidden></div><div id="status" role="status" aria-live="polite"></div><div id="candidates"></div><section class="result-panel" aria-label="座標結果"><div id="badge" hidden></div><div id="empty"><span>⌖</span><p>輸入地址，取得座標</p></div><div id="result" hidden><div class="map-wrap"><iframe id="inline-map" title="Google 地圖：查詢位置" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><button id="recenter" type="button" aria-label="回到查詢位置">⌖</button><div id="map-status" role="status">地圖載入中…</div></div><h2 id="place-name"></h2><p id="place-address"></p><p id="precision"></p><div class="coord-grid"><div class="coord"><div>緯度</div><strong id="lat"></strong><button id="copy-lat">複製 ⧉</button></div><div class="coord"><div>經度</div><strong id="lon"></strong><button id="copy-lon">複製 ⧉</button></div></div><div class="pair-row"><input id="pair" readonly aria-label="整組座標，緯度在前、經度在後"><button id="copy-pair" class="primary">複製座標</button></div><a id="map-link" class="map-link" target="_blank" rel="noopener noreferrer">Google Maps 確認座標 <span>↗</span></a></div></section></section><footer><details><summary>服務說明</summary><p>地址查詢使用免費 Photon 服務，資料可能缺漏。內嵌地圖使用 Google Maps，標記為查詢結果，不是手機目前位置。顯示地圖時，座標會傳送給 Google。Google Maps 按鈕會另開地圖，不會回寫座標。點選後，地址或座標將傳送給 Google。</p></details><div class="attribution"><a href="https://github.com/komoot/photon" target="_blank" rel="noopener">Photon</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></div></footer></main><div id="toast" role="status" aria-live="polite"></div><script src="map.js"></script><script src="address.js"></script><script src="app.js"></script></body></html>
